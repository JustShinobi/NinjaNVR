version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # RustCrypto digest 0.11 migration requires coordinated bump across hmac, sha2, and pbkdf2
      - dependency-name: "hmac"
        versions: [">= 0.13.0, < 0.14.0"]
      - dependency-name: "sha2"
        versions: [">= 0.11.0, < 0.12.0"]
      - dependency-name: "pbkdf2"
        versions: [">= 0.13.0, < 0.14.0"]
      # Breaking API changes tracked for dedicated code migration
      - dependency-name: "rcgen"
        versions: [">= 0.14.0, < 0.15.0"]
      - dependency-name: "rand"
        versions: [">= 0.9.0"]
      - dependency-name: "reqwest"
        versions: [">= 0.13.0"]
      # Keep tokio-tungstenite aligned with axum 0.8 (which depends on 0.29)
      - dependency-name: "tokio-tungstenite"
        versions: [">= 0.30.0"]

  - package-ecosystem: "bun"
    directory: "/web-v2"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Keep Vite 6 + TypeScript 5 until Rolldown manualChunks migration
      - dependency-name: "vite"
        versions: [">= 7.0.0"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">= 5.0.0"]
      - dependency-name: "typescript"
        versions: [">= 6.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
