name: Release & Container Publish

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional explicit tag (e.g. v0.9.2-rc.1 or v0.9.2) to build & publish manually'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cut-release:
    name: Cut Release (dev Pre-Release / main Stable)
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      (github.event_name == 'push' || inputs.publish_tag == '')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      channel_tag: ${{ steps.release.outputs.channel_tag }}
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Cut SemVer release (Pre-Release on dev, Stable on main)
        id: release
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/cut-release

  publish-ghcr:
    name: Build & Publish Container (ghcr.io)
    needs: [cut-release]
    if: >-
      always() &&
      (
        needs.cut-release.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.resolve.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve target release tag and channel
        id: resolve
        run: |
          if [ -n "${{ needs.cut-release.outputs.tag_name }}" ]; then
            TAG="${{ needs.cut-release.outputs.tag_name }}"
            CHANNEL="${{ needs.cut-release.outputs.channel_tag }}"
          else
            TAG="${{ inputs.publish_tag }}"
            if [[ "${TAG}" == *-* ]]; then
              CHANNEL="dev"
            else
              CHANNEL="latest"
            fi
          fi
          echo "Resolved release tag: ${TAG} (channel: ${CHANNEL})"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/justshinobi/ninjanvr
          tags: |
            type=raw,value=${{ steps.resolve.outputs.tag }}
            type=raw,value=${{ steps.resolve.outputs.channel }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NINJANVR_RELEASE_VERSION=${{ steps.resolve.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Prune old GHCR RC and untagged versions (keep latest 10 RC tags)
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          MAX_RC_TO_KEEP = 10
          STABLE_RE = re.compile(r"^v\d+\.\d+\.\d+$")
          RC_RE = re.compile(r"^v(\d+)\.(\d+)\.(\d+)-rc\.(\d+)$")
          owner = os.environ.get("PACKAGE_OWNER", "JustShinobi")

          res = subprocess.run(
              [
                  "gh",
                  "api",
                  "--paginate",
                  "--slurp",
                  f"/users/{owner}/packages/container/ninjanvr/versions?per_page=100",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          if res.returncode != 0 or not res.stdout.strip():
              print(f"Skipping GHCR version prune (API returned {res.returncode}): {res.stderr.strip()}")
              raise SystemExit(0)

          try:
              raw_pages = json.loads(res.stdout)
              versions = (
                  [item for page in raw_pages for item in page]
                  if raw_pages and isinstance(raw_pages[0], list)
                  else raw_pages
              )
          except Exception as exc:
              print(f"Skipping GHCR version prune (JSON parse error): {exc}")
              raise SystemExit(0)

          rc_entries = []
          orphan_ids = []

          for v in versions:
              vid = v.get("id")
              tags = (
                  v.get("metadata", {})
                  .get("container", {})
                  .get("tags", [])
              )
              if any(t in ("latest", "dev") or STABLE_RE.match(t) for t in tags):
                  continue

              rc_matches = [m for t in tags if (m := RC_RE.match(t))]
              if rc_matches:
                  best_rc = max(
                      (int(m.group(1)), int(m.group(2)), int(m.group(3)), int(m.group(4)))
                      for m in rc_matches
                  )
                  rc_entries.append((best_rc, v.get("created_at", ""), vid, tags))
              else:
                  # Untagged or legacy sha-* only image version
                  orphan_ids.append((vid, tags))

          rc_entries.sort(reverse=True)
          to_delete = [
              (vid, tags) for _, _, vid, tags in rc_entries[MAX_RC_TO_KEEP:]
          ] + orphan_ids

          print(
              f"GHCR retention check: {len(rc_entries)} RC version(s) found (keeping up to {MAX_RC_TO_KEEP}), "
              f"{len(to_delete)} old/orphan version(s) queued for deletion."
          )
          for vid, tags in to_delete:
              del_res = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "DELETE",
                      f"/users/{owner}/packages/container/ninjanvr/versions/{vid}",
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if del_res.returncode == 0:
                  print(f"Deleted GHCR package version {vid} (tags={tags})")
              else:
                  print(f"Could not delete GHCR package version {vid} (tags={tags}): {del_res.stderr.strip()}")
          PY

  gitops-bump:
    name: Promote Release Tag to GitOps
    needs: [publish-ghcr]
    if: always() && needs.publish-ghcr.result == 'success'
    runs-on: ubuntu-latest
    env:
      GITOPS_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
      GITOPS_REPO: ${{ vars.GITOPS_REPO || 'JustShinobi/k3s-gitops-prod' }}
      GITOPS_MANIFEST_PATH: ${{ vars.GITOPS_MANIFEST_PATH || 'clusters/prod/workloads/ninjanvr/ninjanvr.yaml' }}
      IMAGE_TAG: ${{ needs.publish-ghcr.outputs.image_tag }}
    steps:
      - name: Check GitOps token availability
        id: check_token
        run: |
          if [ -z "${GITOPS_TOKEN}" ]; then
            echo "PLATFORM_GITOPS_TOKEN not configured; skipping GitOps promotion."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout GitOps repository
        if: steps.check_token.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ env.GITOPS_TOKEN }}
          path: gitops

      - name: Bump NinjaNVR image tag in GitOps manifest
        if: steps.check_token.outputs.enabled == 'true'
        working-directory: gitops
        run: |
          sed -i -E "s|(image:[[:space:]]*ghcr\.io/justshinobi/ninjanvr:)[^[:space:]]+|\1${IMAGE_TAG}|g" "${GITOPS_MANIFEST_PATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "${GITOPS_MANIFEST_PATH}"; then
            echo "GitOps manifest already at ${IMAGE_TAG}; nothing to commit."
          else
            git add "${GITOPS_MANIFEST_PATH}"
            git commit -m "chore(gitops): bump ninjanvr to ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
