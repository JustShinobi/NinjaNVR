name: Release & Container Publish

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional explicit tag (e.g. v0.9.2-rc.1 or v0.9.2) to build & publish manually'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Workspace Gate (Rust + Web + Privacy)
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      (github.event_name == 'push' || inputs.publish_tag == '')
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check repository privacy and hygiene guardrails
        run: ./scripts/ci/check-privacy

      - name: Check SemVer and release manifest invariants
        run: ./scripts/ci/check-semver

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install and verify NinjaNVR Console (web)
        run: |
          bun install --cwd web --frozen-lockfile
          bun run --cwd web typecheck
          bun run --cwd web test
          bun run --cwd web build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace unit & integration tests
        run: cargo test --workspace --locked

  cut-release:
    name: Cut Release (dev Pre-Release / main Stable)
    needs: [verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      channel_tag: ${{ steps.release.outputs.channel_tag }}
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify repository privacy and SemVer manifest invariants
        run: |
          ./scripts/ci/check-privacy
          ./scripts/ci/check-semver

      - name: Cut SemVer release (Pre-Release on dev, Stable on main)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/cut-release

  publish-ghcr:
    name: Build & Publish Container (ghcr.io)
    needs: [cut-release]
    if: >-
      always() &&
      (
        needs.cut-release.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_tag: ${{ steps.resolve.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve target release tag and channel
        id: resolve
        env:
          CUT_TAG: ${{ needs.cut-release.outputs.tag_name }}
          CUT_CHANNEL: ${{ needs.cut-release.outputs.channel_tag }}
          INPUT_PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if [ -n "${CUT_TAG}" ]; then
            TAG="${CUT_TAG}"
            CHANNEL="${CUT_CHANNEL}"
          else
            TAG="${INPUT_PUBLISH_TAG}"
            if [[ "${TAG}" == *-* ]]; then
              CHANNEL="dev"
            else
              CHANNEL="latest"
            fi
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release tag format: ${TAG}" >&2
            exit 1
          fi
          echo "Resolved release tag: ${TAG} (channel: ${CHANNEL})"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/justshinobi/ninjanvr
          tags: |
            type=raw,value=${{ steps.resolve.outputs.tag }}
            type=raw,value=${{ steps.resolve.outputs.channel }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            NINJANVR_RELEASE_VERSION=${{ steps.resolve.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Prune old GHCR RC versions (keep latest 10 RC tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          CURRENT_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          MAX_RC_TO_KEEP = 10
          STABLE_RE = re.compile(r"^v\d+\.\d+\.\d+$")
          RC_RE = re.compile(r"^v(\d+)\.(\d+)\.(\d+)-rc\.(\d+)$")
          LEGACY_SHA_RE = re.compile(r"^sha-[0-9a-f]+$")
          BROKEN_RC_TAGS = {"v2.3.9-rc.1"}
          owner = os.environ.get("PACKAGE_OWNER", "JustShinobi")
          current_tag = os.environ.get("CURRENT_TAG", "").strip()

          res = subprocess.run(
              [
                  "gh",
                  "api",
                  "--paginate",
                  "--slurp",
                  f"/users/{owner}/packages/container/ninjanvr/versions?per_page=100",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          if res.returncode != 0 or not res.stdout.strip():
              print(f"Skipping GHCR version prune (API returned {res.returncode}): {res.stderr.strip()}")
              raise SystemExit(0)

          try:
              raw_pages = json.loads(res.stdout)
              versions = (
                  [item for page in raw_pages for item in page]
                  if raw_pages and isinstance(raw_pages[0], list)
                  else raw_pages
              )
          except Exception as exc:
              print(f"Skipping GHCR version prune (JSON parse error): {exc}")
              raise SystemExit(0)

          rc_entries = []
          legacy_sha_ids = []

          for v in versions:
              vid = v.get("id")
              tags = (
                  v.get("metadata", {})
                  .get("container", {})
                  .get("tags", [])
              )
              # Never delete untagged package versions: in GHCR, child platform
              # and attestation manifests referenced by OCI Image Indexes have
              # no tags of their own, and deleting them corrupts parent tags.
              if not tags:
                  continue
              if any(t in ("latest", "dev", current_tag) or STABLE_RE.match(t) for t in tags):
                  continue
              if any(t in BROKEN_RC_TAGS for t in tags):
                  legacy_sha_ids.append((vid, tags))
                  continue

              rc_matches = [m for t in tags if (m := RC_RE.match(t))]
              if rc_matches:
                  best_rc = max(
                      (int(m.group(1)), int(m.group(2)), int(m.group(3)), int(m.group(4)))
                      for m in rc_matches
                  )
                  if current_tag.startswith("v2.") and best_rc[0] >= 3:
                      legacy_sha_ids.append((vid, tags))
                  else:
                      rc_entries.append((v.get("created_at", ""), best_rc, vid, tags))
              elif all(LEGACY_SHA_RE.match(t) for t in tags):
                  legacy_sha_ids.append((vid, tags))

          rc_entries.sort(reverse=True)
          to_delete = [
              (vid, tags) for _, _, vid, tags in rc_entries[MAX_RC_TO_KEEP:]
          ] + legacy_sha_ids

          print(
              f"GHCR retention check: {len(rc_entries)} RC version(s) found (keeping up to {MAX_RC_TO_KEEP}), "
              f"{len(to_delete)} old RC/legacy-sha version(s) queued for deletion."
          )
          for vid, tags in to_delete:
              del_res = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "DELETE",
                      f"/users/{owner}/packages/container/ninjanvr/versions/{vid}",
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if del_res.returncode == 0:
                  print(f"Deleted GHCR package version {vid} (tags={tags})")
              else:
                  print(f"Could not delete GHCR package version {vid} (tags={tags}): {del_res.stderr.strip()}")
          PY

  gitops-bump:
    name: Promote Release Tag to GitOps
    needs: [publish-ghcr]
    if: >-
      always() &&
      needs.publish-ghcr.result == 'success' &&
      vars.GITOPS_REPO != '' &&
      vars.GITOPS_MANIFEST_PATH != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITOPS_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      GITOPS_REPO: ${{ vars.GITOPS_REPO }}
      GITOPS_MANIFEST_PATH: ${{ vars.GITOPS_MANIFEST_PATH }}
      GITOPS_KUSTOMIZATION_PATH: ${{ vars.GITOPS_KUSTOMIZATION_PATH }}
      GITOPS_BOT_NAME: "${{ vars.GITOPS_BOT_NAME || 'github-actions[bot]' }}"
      GITOPS_BOT_EMAIL: "${{ vars.GITOPS_BOT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}"
      IMAGE_TAG: ${{ needs.publish-ghcr.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.publish-ghcr.outputs.image_digest }}
    steps:
      - name: Resolve GitOps authentication token (GitHub App or PAT fallback)
        id: check_token
        run: |
          if [ -n "${GITOPS_APP_ID}" ] && [ -n "${GITOPS_APP_PRIVATE_KEY}" ]; then
            TOKEN="$(python3 - <<'PY'
          import base64, json, os, subprocess, time, urllib.request
          def b64url(b: bytes) -> str:
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          app_id = os.environ["GITOPS_APP_ID"].strip()
          priv_key = os.environ["GITOPS_APP_PRIVATE_KEY"].strip()
          owner = os.environ["GITOPS_REPO"].strip().split("/", 1)[0]
          now = int(time.time())
          h = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
          p = b64url(json.dumps({"iat": now - 60, "exp": now + 300, "iss": app_id}).encode())
          proc = subprocess.run(
              ["bash", "-c", 'openssl dgst -sha256 -sign <(printf "%s" "$PRIV_KEY")'],
              input=f"{h}.{p}".encode(),
              env={"PRIV_KEY": priv_key, "PATH": "/usr/bin:/bin"},
              capture_output=True,
              check=True,
          )
          jwt_tok = f"{h}.{p}.{b64url(proc.stdout)}"
          req = urllib.request.Request(
              "https://api.github.com/app/installations",
              headers={"Authorization": f"Bearer {jwt_tok}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as resp:
              installs = json.loads(resp.read().decode())
          inst_id = next(
              (str(i["id"]) for i in installs if i.get("account", {}).get("login", "").lower() == owner.lower()),
              "",
          )
          if not inst_id:
              raise RuntimeError(f"No GitHub App installation found for owner '{owner}'")
          req2 = urllib.request.Request(
              f"https://api.github.com/app/installations/{inst_id}/access_tokens",
              method="POST",
              headers={"Authorization": f"Bearer {jwt_tok}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req2) as resp2:
              print(json.loads(resp2.read().decode())["token"])
          PY
            )"
            echo "::add-mask::${TOKEN}"
            echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${GITOPS_TOKEN}" ]; then
            echo "token=${GITOPS_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Neither GITOPS_APP_ID/PRIVATE_KEY nor PLATFORM_GITOPS_TOKEN configured; skipping GitOps promotion."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout GitOps repository
        if: steps.check_token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ steps.check_token.outputs.token }}
          path: gitops

      - name: Bump NinjaNVR image tag and digest in GitOps manifests
        if: steps.check_token.outputs.enabled == 'true'
        working-directory: gitops
        run: |
          KUSTOMIZATION_PATH="${GITOPS_KUSTOMIZATION_PATH:-$(dirname "${GITOPS_MANIFEST_PATH}")/kustomization.yaml}"
          sed -i -E "s|(image:[[:space:]]*ghcr\.io/justshinobi/ninjanvr:)[^[:space:]]+|\1${IMAGE_TAG}|g" "${GITOPS_MANIFEST_PATH}"
          if [ -f "${KUSTOMIZATION_PATH}" ]; then
            sed -i -E "s|(newTag:[[:space:]]*)[^[:space:]]+|\1${IMAGE_TAG}|g" "${KUSTOMIZATION_PATH}"
            if [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              sed -i -E "s|(digest:[[:space:]]*)sha256:[0-9a-f]{64}|\1${IMAGE_DIGEST}|g" "${KUSTOMIZATION_PATH}"
            fi
          fi
          git config user.name "${GITOPS_BOT_NAME}"
          git config user.email "${GITOPS_BOT_EMAIL}"
          if [ -f "${KUSTOMIZATION_PATH}" ]; then
            DIFF_TARGETS=("${GITOPS_MANIFEST_PATH}" "${KUSTOMIZATION_PATH}")
          else
            DIFF_TARGETS=("${GITOPS_MANIFEST_PATH}")
          fi
          if git diff --quiet -- "${DIFF_TARGETS[@]}"; then
            echo "GitOps manifest already at ${IMAGE_TAG} (${IMAGE_DIGEST}); nothing to commit."
          else
            git add -- "${DIFF_TARGETS[@]}"
            git commit -m "chore(gitops): bump ninjanvr to ${IMAGE_TAG}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
