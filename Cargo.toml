[workspace]
resolver = "2"
members = [
    "crates/ninjanvr-config",
    "crates/ninjanvr-db",
    "crates/ninjanvr-media",
    "crates/ninjanvr-vision",
    "crates/ninjanvr-infer",
    "crates/ninjanvr-track",
    "crates/ninjanvr-vod",
    "crates/ninjanvr-comms",
    "crates/ninjanvr-server",
]

[workspace.package]
version = "2.1.9"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/JustShinobi/NinjaNVR"
authors = ["NinjaNVR Contributors"]

[workspace.lints.rust]
unused_must_use = "deny"
nonstandard_style = { level = "deny", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
redundant_clone = "deny"
clone_on_copy = "deny"
needless_collect = "deny"
manual_ok_or = "deny"
map_unwrap_or = "deny"
result_large_err = "deny"
type_complexity = "deny"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors", "compression-gzip", "compression-br", "trace"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = "0.13"
base64 = "0.23"
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
hyper = { version = "1.12", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
bytes = "1.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
nix = { version = "0.31", features = ["fs", "process", "signal"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
